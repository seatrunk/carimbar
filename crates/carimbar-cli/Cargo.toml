[package]
name = "carimbar-cli"
description = "CLI do carimbar: emissão de NF-e e NFS-e e administração do cofre"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carimbar-cli"
readme.workspace = true
keywords.workspace = true
categories = ["finance", "command-line-utilities"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "carimbar"
path = "src/main.rs"

[dependencies]
carimbar.workspace = true
carimbar-cert.workspace = true
carimbar-nfse.workspace = true
carimbar-transport.workspace = true
carimbar-types.workspace = true
carimbar-vault.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
carimbar-nfse.workspace = true

[lints]
workspace = true
