[package]
name = "carimbar-nfe"
description = "Modelo e serviços da NF-e 4.00 com IBS/CBS (carimbar)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carimbar-nfe"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
nfe-sha1 = ["carimbar-dsig/nfe-sha1"]
nfe-sha1-vendored = ["nfe-sha1", "carimbar-dsig/nfe-sha1-vendored"]
xsd = ["carimbar-xml/xsd"]

[dependencies]
carimbar-dsig.workspace = true
carimbar-endpoints.workspace = true
carimbar-nfse.workspace = true
carimbar-transport.workspace = true
carimbar-types.workspace = true
carimbar-xml.workspace = true
thiserror.workspace = true

[dev-dependencies]
carimbar-xml = { workspace = true, features = ["xsd"] }

[lints]
workspace = true
