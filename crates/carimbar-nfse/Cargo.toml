[package]
name = "carimbar-nfse"
description = "DPS e cliente Sefin/ADN da NFS-e Nacional (carimbar)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carimbar-nfse"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
xsd = ["carimbar-xml/xsd"]

[dependencies]
base64 = "0.22"
carimbar-dsig.workspace = true
carimbar-endpoints.workspace = true
carimbar-transport.workspace = true
carimbar-types.workspace = true
carimbar-xml.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
carimbar-xml = { workspace = true, features = ["xsd"] }

[lints]
workspace = true
