[package]
name = "carimbar-dsig"
description = "XMLDSig enveloped para NF-e e NFS-e via trait Signer (carimbar)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carimbar-dsig"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
nfe-sha1 = ["carimbar-cert/nfe-sha1"]

[dependencies]
base64 = "0.22"
carimbar-cert.workspace = true
carimbar-xml.workspace = true
ring = "0.17"
sha2.workspace = true
thiserror.workspace = true
x509-parser = "0.18"

[dev-dependencies]
carimbar-types.workspace = true
carimbar-xml = { workspace = true, features = ["xsd"] }

[lints]
workspace = true
