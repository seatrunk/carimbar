[package]
name = "carimbar"
description = "Emissão de NF-e e NFS-e Nacional para devs e agentes de IA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carimbar"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
nfe-sha1 = ["carimbar-nfe/nfe-sha1"]

[dependencies]
carimbar-cert.workspace = true
carimbar-danfe.workspace = true
carimbar-dsig.workspace = true
carimbar-endpoints.workspace = true
carimbar-nfe.workspace = true
carimbar-nfse.workspace = true
carimbar-transport.workspace = true
carimbar-types.workspace = true
carimbar-vault.workspace = true
carimbar-xml.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
