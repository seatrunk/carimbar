[package]
name = "carimbar-xml"
description = "Escrita e leitura de XML fiscal com C14N 1.0 própria e validação XSD (carimbar)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carimbar-xml"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# O teste de SHA lê ../../schemas e não vai no pacote; nenhum XSD é empacotado.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
# Habilita a validação XSD. O schema não é embutido: informe o caminho do XSD.
xsd = ["dep:xsd-schema"]

[dependencies]
carimbar-types.workspace = true
quick-xml = { version = "0.42", default-features = false }
thiserror.workspace = true
xsd-schema = { version = "0.3.1", default-features = false, optional = true }

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
