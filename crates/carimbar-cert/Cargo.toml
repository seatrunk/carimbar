[package]
name = "carimbar-cert"
description = "Leitura de certificados A1 PKCS#12 ICP-Brasil (carimbar)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carimbar-cert"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
# Backend apenas para RSA-SHA1 exigido pelo contrato legado da NF-e.
nfe-sha1 = ["dep:openssl"]

[dependencies]
carimbar-types.workspace = true
p12-keystore = "0.4.1"
ring = "0.17"
thiserror.workspace = true
x509-parser = "0.18"
zeroize = "1"
openssl = { version = "0.10", optional = true }

[dev-dependencies]

[lints]
workspace = true
