[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "carimbar"
description = "Emissão de NF-e e NFS-e Nacional para devs e agentes de IA"
# O readme herdado do Cargo não entra no PKG-INFO; o PyPI usa este campo.
readme = "../../README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dynamic = ["version"]
classifiers = ["Programming Language :: Rust", "Development Status :: 1 - Planning"]

[tool.maturin]
python-source = "python"
module-name = "carimbar._carimbar"
features = ["nfe-sha1"]
sdist-include = ["python/**/*.py", "tests/*.py"]
