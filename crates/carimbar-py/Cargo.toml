[package]
name = "carimbar-py"
description = "Binding Python do carimbar (PyO3, abi3); distribuído pelo PyPI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carimbar-py"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Vai pelo PyPI (maturin), não pelo crates.io.
publish = false

[features]
default = []
nfe-sha1 = ["carimbar/nfe-sha1-vendored"]

[lib]
name = "_carimbar"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
carimbar.workspace = true
pyo3 = { workspace = true, features = ["extension-module"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
