[package]
name = "carimbar-mcp"
description = "Servidor MCP stdio do carimbar para agentes de IA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/carimbar-mcp"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "carimbar-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
carimbar.workspace = true
carimbar-cert.workspace = true
carimbar-nfse.workspace = true
carimbar-transport.workspace = true
carimbar-types.workspace = true
carimbar-vault.workspace = true
getrandom = "0.4"
rmcp = { version = "3.9", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
carimbar-nfse.workspace = true

[lints]
workspace = true
