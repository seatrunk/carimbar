name: Release

# Publicação. Só roda em tag v* ou manualmente; nunca em branch nem em PR.
# Configuração necessária: docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARIMBAR_PRODUCAO: "0"

jobs:
  wheels:
    name: wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: universal2-apple-darwin, manylinux: "" }
          - { os: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/carimbar-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: crates/carimbar-py/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/carimbar-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/carimbar-py/dist/*.tar.gz

  pypi:
    # Trusted publishing (OIDC): sem token guardado no repo.
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/carimbar
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates-io:
    # DESATIVADO até o Ricardo criar a conta no crates.io e decidir entre
    # token (CARGO_REGISTRY_TOKEN no environment crates-io) e trusted publishing.
    # Os crates têm `publish = false` no workspace; trocar antes de ativar.
    if: false
    needs: [pypi]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - name: Publica em ordem de dependência
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for c in carimbar-types carimbar-xml carimbar-dsig carimbar-cert carimbar-endpoints \
                   carimbar-transport carimbar-nfe carimbar-nfse carimbar-danfe carimbar-vault \
                   carimbar carimbar-cli carimbar-mcp; do
            cargo publish --locked -p "$c"
          done
