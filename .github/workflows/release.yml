name: Release

# Publicação. Só roda em tag v* ou manualmente; nunca em branch nem em PR.
# Configuração necessária: docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # Recuperação de uma release que parou no meio (ex.: 429 do crates.io):
    # roda de novo a partir da tag já existente, sem criar tag nova.
    inputs:
      tag:
        description: "Tag já existente a (re)publicar, ex.: v0.0.1"
        required: true

permissions:
  contents: read

env:
  CARIMBAR_PRODUCAO: "0"

jobs:
  verificar:
    # Gate de tudo que publica: tag == versão do workspace, e testes verdes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag vX.Y.Z bate com a versão do workspace
        env:
          REF_TYPE: ${{ inputs.tag && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          versao=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print({p["version"] for p in json.load(sys.stdin)["packages"]}.pop())')
          echo "versão do workspace: $versao; ref: $REF_TYPE $REF_NAME"
          if [[ "$REF_TYPE" != tag || "$REF_NAME" != "v$versao" ]] \
             || ! git rev-parse -q --verify "refs/tags/$REF_NAME" >/dev/null; then
            echo "::error::release exige a tag v$versao (recebido: $REF_TYPE $REF_NAME)"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y xmlsec1
      - run: cargo test --workspace --locked
      - run: ./scripts/check-no-certs.sh

  wheels:
    needs: [verificar]
    name: wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: universal2-apple-darwin, manylinux: "" }
          - { os: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/carimbar-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: crates/carimbar-py/dist/*.whl

  sdist:
    needs: [verificar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/carimbar-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/carimbar-py/dist/*.tar.gz

  pypi:
    # Trusted publishing (OIDC): sem token guardado no repo.
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/carimbar
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates-io:
    # Primeira publicação por token (escopo publish-new, validade curta) guardado no
    # environment crates-io, que exige aprovação do seatrunk e só aceita tags v*.
    # Depois: trusted publishing (rust-lang/crates-io-auth-action). Ver docs/release.md.
    needs: [verificar]
    runs-on: ubuntu-latest
    environment: crates-io
    # Com o limite de crate novo (~1 a cada 10 min depois da rajada), 13 crates
    # novos levam ~80 min.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      # O script de publicação vem do commit do workflow (pode ser mais novo que a tag).
      - uses: actions/checkout@v5
        with:
          path: .release-tools
          sparse-checkout: scripts
      - run: mv .release-tools "$RUNNER_TEMP/release-tools"
      - name: Dry-run do workspace
        run: cargo publish --workspace --locked --dry-run
      - name: Publica o que falta, em ordem topológica
        # Idempotente: pula crate já publicado e espera no 429. Ver scripts/publish-crates.sh.
        # O token só existe neste passo, via env; nunca é ecoado.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: "$RUNNER_TEMP/release-tools/scripts/publish-crates.sh"
