name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Kill switch: nenhuma etapa do CI pode emitir em produção.
  CARIMBAR_PRODUCAO: "0"

jobs:
  sem-certificados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test-check-no-certs.sh
      - run: ./scripts/check-no-certs.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # carimbar-dsig verifica assinaturas com o xmlsec1 como ferramenta independente.
      - run: sudo apt-get update && sudo apt-get install -y xmlsec1
      - run: cargo test --workspace --locked

  xml:
    # A feature xsd é opcional: os dois modos precisam compilar e testar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p carimbar-xml --no-default-features --locked
      - run: cargo test -p carimbar-xml --features xsd --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --locked
      - run: cargo +1.88 check -p carimbar-xml --features xsd --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/carimbar-py
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Instala o wheel e faz smoke test
        run: |
          pip install crates/carimbar-py/dist/*.whl
          python -c "import carimbar as c; assert c.validar_cnpj('00.000.001/0001-36'); assert not c.validar_cnpj('00000001000137'); print('ok', c.__version__)"

  package:
    # Garante que o workspace continua publicável (sem enviar nada).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --locked --dry-run
