name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Kill switch: nenhuma etapa do CI pode emitir em produção.
  CARIMBAR_PRODUCAO: "0"

jobs:
  sem-certificados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test-check-no-certs.sh
      - run: ./scripts/check-no-certs.sh

  workflows:
    # O release não roda em PR; valida todos os workflows (inclui shellcheck).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Os testes de assinatura conferem o XMLDSig com o xmlsec1 como ferramenta
      # independente.
      - run: sudo apt-get update && sudo apt-get install -y xmlsec1
      - run: cargo test --workspace --locked

  xml:
    # A feature xsd é opcional: os dois modos precisam compilar e testar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # A suíte inteira de carimbar roda com xsd, incluindo os testes de dsig
      # que conferem o XMLDSig com o xmlsec1.
      - run: sudo apt-get update && sudo apt-get install -y xmlsec1
      - run: cargo check -p carimbar --no-default-features --features xml --locked
      - run: cargo test -p carimbar --features xsd --locked

  nfe-sha1:
    # Exceção opcional de OpenSSL só para o perfil legado da NF-e.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xmlsec1 libssl-dev pkg-config
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo publish --workspace --all-features --locked --dry-run
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check -p carimbar --no-default-features --features nfe-sha1 --locked
      - name: Confere que OpenSSL não entrou no grafo padrão
        run: |
          python3 - <<'PY'
          import subprocess
          graph = subprocess.check_output(['cargo', 'tree', '--workspace', '--edges', 'normal', '--prefix', 'none', '--locked'], text=True)
          assert not any(line.startswith('openssl') for line in graph.splitlines()), graph
          PY

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check --workspace --locked
      - run: cargo +1.89 check -p carimbar --no-default-features --features xsd --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/carimbar-py
          command: build
          args: --release --out dist
          manylinux: auto
          before-script-linux: |
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y perl-IPC-Cmd perl-Time-Piece
            else
              yum install -y perl-IPC-Cmd perl-Time-Piece
            fi
      - name: Instala o wheel e roda pytest
        run: |
          pip install pytest crates/carimbar-py/dist/*.whl
          pytest crates/carimbar-py/tests -q
          python -c "import carimbar as c; assert c.validar_cnpj('00.000.001/0001-36'); assert not c.validar_cnpj('00000001000137'); print('ok', c.__version__)"

  wheel-cross:
    # Mesma configuração do job `wheels` do release.yml para os alvos que usam
    # as imagens rust-cross (Ubuntu com apt) em vez das imagens quay.io/pypa:
    # linux-aarch64 (manylinux-cross) e musllinux-x86_64 (musl-cross).
    # Builda e importa cada wheel; não publica nada.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-aarch64, target: aarch64, manylinux: 2_28 }
          - { name: musllinux-x86_64, target: x86_64, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/carimbar-py
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          # Manter igual ao before-script-linux do job wheels em release.yml.
          # O OpenSSL vendored precisa de Perl com IPC::Cmd e Time::Piece; a
          # imagem usada depende do alvo e o gerenciador de pacotes muda.
          before-script-linux: |
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache perl
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y perl
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y perl-IPC-Cmd perl-Time-Piece
            elif command -v yum >/dev/null 2>&1; then
              yum install -y perl-IPC-Cmd perl-Time-Piece
            else
              echo "before-script-linux: gerenciador de pacotes não reconhecido" >&2
              exit 1
            fi
            perl -MIPC::Cmd -MTime::Piece -e1
      - uses: docker/setup-qemu-action@v3
        if: matrix.name == 'linux-aarch64'
      - name: Instala e importa o wheel musllinux
        if: matrix.name == 'musllinux-x86_64'
        run: |
          docker run --rm -v "$PWD/crates/carimbar-py/dist:/dist" python:3.12-alpine \
            sh -c "python -m pip install --quiet /dist/*.whl && python -c 'import carimbar; print(\"ok musllinux\", carimbar.__version__)'"
      - name: Instala e importa o wheel aarch64
        if: matrix.name == 'linux-aarch64'
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD/crates/carimbar-py/dist:/dist" python:3.12-slim \
            sh -c "python -m pip install --quiet /dist/*.whl && python -c 'import carimbar; print(\"ok aarch64\", carimbar.__version__)'"

  package:
    # Garante que o workspace continua publicável (sem enviar nada).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --locked --dry-run
