[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/seatrunk/carimbar"
publish = false

[workspace.dependencies]
carimbar-types = { path = "crates/carimbar-types" }
carimbar-xml = { path = "crates/carimbar-xml" }
carimbar-dsig = { path = "crates/carimbar-dsig" }
carimbar-cert = { path = "crates/carimbar-cert" }
carimbar-transport = { path = "crates/carimbar-transport" }
carimbar-endpoints = { path = "crates/carimbar-endpoints" }
carimbar-nfe = { path = "crates/carimbar-nfe" }
carimbar-nfse = { path = "crates/carimbar-nfse" }
carimbar-danfe = { path = "crates/carimbar-danfe" }
carimbar-vault = { path = "crates/carimbar-vault" }
carimbar = { path = "crates/carimbar" }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
thiserror = "2"
sha2 = "0.11"
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
