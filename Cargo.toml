[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/seatrunk/carimbar"
homepage = "https://github.com/seatrunk/carimbar"
readme = "README.md"
keywords = ["nfe", "nfse", "fiscal", "brasil", "sefaz"]
categories = ["finance", "encoding"]

[workspace.dependencies]
carimbar = { path = "crates/carimbar", version = "=0.0.2" }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
thiserror = "2"
sha2 = "0.11"
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
